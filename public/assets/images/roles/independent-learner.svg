            <stop offset=".52" stop-color="#3B82F6" stop-opacity=".19"/>
            <stop offset="1" stop-color="#22D3EE" stop-opacity=".14"/>
        </linearGradient>

        <linearGradient id="hoodie" x1="366" y1="330" x2="638" y2="650" gradientUnits="userSpaceOnUse">
