<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc">
    <title id="title">Independent Learner</title>
    <desc id="desc">A learner studying independently with a laptop, books, notes and headphones.</desc>

    <defs>
        <linearGradient id="bg" x1="120" y1="70" x2="880" y2="760" gradientUnits="userSpaceOnUse">
